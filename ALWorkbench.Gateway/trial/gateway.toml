# AL Workbench Gateway settings - trial on one test server
#
# A starting point for trying the gateway on a single test server, such as a
# Business Central demo install in a virtual machine. It lets the gateway do
# everything on one service tier, so do not use it on a customer's server.
# gateway.example.toml beside this file explains every setting.
#
# Before you start:
#   1. Replace CHANGE-ME (three places) with this computer's name. Run "hostname"
#      in a command prompt to see it.
#   2. Replace BC250 (two places) with your service tier's name, as the Business
#      Central Administration Shell shows it (Get-NAVServerInstance).
#   3. Run "ALWorkbench.Gateway check" from a command prompt opened with
#      "Run as administrator". It lists any mistakes in this file.

[[instance]]
machine = "CHANGE-ME"
name = "BC250"
environment = "test"
allow = ["inventory", "session_users", "publish", "unpublish", "restart", "service_control", "licence"]
# Apps built by AL Workbench are not signed today, so deployments need this.
allow_unsigned = true

[[database]]
name = "Trial database"
publish_on = { machine = "CHANGE-ME", instance = "BC250" }
restart = [{ machine = "CHANGE-ME", instance = "BC250" }]
licence_target = "NavDatabase"
