name: staging

# Publishes a preview image so a branch can be run as a real instance before it
# merges — the design-system migration is the case this was built for.
#
# Two triggers, because they become available at different times:
#
#   push        Fires now, from the branch itself. `workflow_dispatch` does NOT:
#               GitHub only offers a manual run for workflows that exist on the
#               DEFAULT branch, so until this file lands on main the push
#               trigger is the only one that works. Keep the branch list short
#               and delete entries when a branch merges — every push rebuilds
#               the image, which is what you want for a staging instance you're
#               actually watching, and waste for one you aren't.
#
#   dispatch    Works once this file is on main, for any branch:
#                   gh workflow run staging.yml --ref <branch>
#               That's the better default for one-off previews.
#
# It does NOT wait for build.yml to be green, unlike release.yml. A staging
# image is for looking at, not for operators to pin, and the whole point is
# being able to boot a branch quickly. build.yml still runs on the same push, so
# check it before you trust what you see.
on:
  workflow_dispatch:
  push:
    branches:
      - design/bc-system

permissions:
  contents: read
  packages: write

jobs:
  # The on-premises gateway built from the same commit, for trying a branch's
  # gateway changes against its staging instance (#1363). Kept as a workflow
  # artifact on the run, not a GitHub release: a staging preview is for looking
  # at, and a release (even a prerelease) is what operators and customer IT are
  # told to download. Never signed. It reports 0.0.0-staging.<commit>, which AL
  # Workbench treats as a preview: never refused for its version and never
  # listed as out of date. The staging image itself carries no release stamp, so
  # its Gateways page offers no download and says so.
  gateway:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish the gateway
        id: publish
        shell: pwsh
        env:
          SHA: ${{ github.sha }}
        run: |
          $version = "0.0.0-staging.$($env:SHA.Substring(0, 7))"
          dotnet publish ALWorkbench.Gateway/ALWorkbench.Gateway.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded `
            -p:ReleaseVersion=$version -o out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash out\ALWorkbench.Gateway.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("out\ALWorkbench.Gateway.exe.sha256", "$hash  ALWorkbench.Gateway.exe`n")
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Keep the gateway on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-${{ steps.publish.outputs.version }}
          path: |
            out/ALWorkbench.Gateway.exe
            out/ALWorkbench.Gateway.exe.sha256
            out/gateway.example.toml
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: pwsh
        env:
          VERSION: ${{ steps.publish.outputs.version }}
          SHA256: ${{ steps.publish.outputs.sha256 }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          @(
            "### Staging gateway published"
            ""
            "Built from ``$env:REF_NAME`` as version ``$env:VERSION``, unsigned. Download it from this run's artifacts (kept 14 days)."
            ""
            "SHA-256: ``$env:SHA256``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        # Third-party actions pinned to full commit SHAs (mutable tags can be
        # force-moved; this job holds packages:write). Same rule as release.yml.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Two tags. `staging` moves with every run so an operator can just pull it
      # again; `staging-<short sha>` is immutable, so a preview that looked right
      # can be pinned or rolled back to. Moving `staging` is not a breach of the
      # "never re-push a published tag" rule in CLAUDE.md — that rule is about
      # release tags, which people pin. This one exists to move.
      #
      # metadata-action rather than a literal image name for the same reason
      # release.yml uses it: it lowercases `github.repository`, so the repo's
      # casing doesn't have to be hardcoded here to satisfy GHCR.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=staging
            type=raw,value=staging-{{sha}}
          labels: |
            org.opencontainers.image.title=AL Workbench (staging)
            org.opencontainers.image.description=Preview build of ${{ github.ref_name }} — not a release
            org.opencontainers.image.version=staging-${{ github.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Staging image published"
            echo
            echo "Built from \`${{ github.ref_name }}\`."
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Run it with the repo's compose file:"
            echo
            echo '```bash'
            echo "ALWORKBENCH_TAG=staging docker compose pull aldevtoolbox"
            echo "ALWORKBENCH_TAG=staging docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
